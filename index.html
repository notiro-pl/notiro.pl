<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">

<title>NOTIRO sp. z o.o.</title>
<meta name="description" content="NOTIRO sp. z o.o. tworzy oprogramowanie dla kancelarii notarialnych.">
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#5f5f5a; --line:#dddcd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#a3a29b; --line:#33332f; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); padding:24px 16px;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; width:100%; }
  h1 { font-size:2rem; letter-spacing:.02em; margin:0 0 .25em; }
  .lead { font-size:1.15rem; margin:0 0 2rem; }
  .note { color:var(--muted); margin:0 0 2rem; }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:.35rem 1.25rem; margin:0;
       padding-top:1.25rem; border-top:1px solid var(--line); }
  dt { color:var(--muted); }
  dd { margin:0; }
  a { color:inherit; }
</style>
</head>

</body>
</html>
